<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jeopardy Host</title>
  <link rel="stylesheet" href="host.css" />
</head>
<body>
  <header class="topbar">
    <h1>Jeopardy Host</h1>
    <div id="team-scores" class="scores-bar"></div>
    <button id="qr-toggle-btn" class="settings-btn" title="Show join QR codes on the board">Show QR Codes</button>
    <button id="settings-btn" class="settings-btn" title="Change game or teams">⚙ Game &amp; Teams</button>
  </header>

  <div id="setup-overlay" class="overlay">
    <div class="overlay-panel">
      <h2>Choose a Game</h2>
      <div id="games-list" class="games-list"></div>

      <div id="team-setup-block" style="display:none;">
        <h2>Teams</h2>
        <div id="teams-setup"></div>
        <div class="row">
          <button id="add-team-btn">Add Team</button>
        </div>
        <button id="start-game-btn" class="primary big">Start Game</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>Category Intro</h2>
        <div class="row">
          <button id="start-intro-btn">Start</button>
          <button id="next-category-btn">Next</button>
          <button id="end-intro-btn">Show Board</button>
        </div>
      </section>

      <section class="panel">
        <h2>Adjust Scores</h2>
        <div id="score-adjust"></div>
      </section>

      <section class="panel">
        <h2>Answer &amp; Buzz</h2>
        <div id="sidebar-answer"></div>
        <div class="row question-controls">
          <button id="reveal-answer-btn">Reveal Answer</button>
          <button id="close-question-btn">Close Question</button>
          <button id="reset-buzzer-btn">Reset Buzzer</button>
        </div>
      </section>
    </aside>

    <main class="main">
      <section class="panel">
        <h2>Board</h2>
        <div id="board-grid" class="board-grid"></div>
      </section>

      <section class="panel">
        <h2>Current Question</h2>
        <div id="question-panel"></div>
      </section>
    </main>
  </div>

  <script src="/shared/ws-client.js"></script>
  <script src="host.js"></script>
</body>
</html>
